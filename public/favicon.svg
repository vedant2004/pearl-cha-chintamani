<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="100%" stop-color="#200407"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE599"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,3"/>
  <!-- Crown / Mukut -->
  <polygon points="50,18 43,30 57,30" fill="url(#goldGrad)"/>
  <circle cx="50" cy="18" r="3" fill="#FFE599"/>
  <!-- Tilak -->
  <path d="M47,32 Q50,28 53,32 Q50,42 47,32 Z" fill="#E65100"/>
  <circle cx="50" cy="35" r="2" fill="#D4AF37"/>
  <!-- Face / Trunk -->
  <path d="M38,36 Q50,30 62,36 Q65,48 56,54 Q50,58 52,68 Q53,74 48,76 Q42,75 44,70 Q45,63 48,59 Q35,52 38,36 Z" fill="url(#goldGrad)"/>
  <!-- Modak -->
  <circle cx="34" cy="62" r="5" fill="#FFE599" stroke="#9A7B1C" stroke-width="1"/>
  <!-- Right Tusk (Broken) -->
  <polygon points="41,47 43,47 42,50" fill="#FFF8E7"/>
  <!-- Left Tusk -->
  <polygon points="58,47 60,47 61,54" fill="#FFF8E7"/>
  <!-- Ears -->
  <path d="M38,38 C28,38 26,48 35,52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M62,38 C72,38 74,48 65,52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <text x="50" y="90" font-size="10" font-family="serif" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">CHINTAMANI</text>
</svg>
